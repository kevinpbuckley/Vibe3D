[FilterPlugin]
; Extra files shipped in the packaged plugin. UAT's BuildPlugin already includes the .uplugin,
; /Resources/..., /Content/..., /Source/... and /Shaders/...; anything at the plugin root (and
; /Config itself) is dropped unless it is listed here.
/README.md
/test_prompts/...

; Markdown agent skills - UE 5.9 discovers <Plugin>/Skills/**/SKILL.md natively
; (ToolsetRegistry MarkdownAgentSkills), keyed /Skills/Vibe3D/<pack>. Outside Content/, so it
; must be listed here to ship in the Fab package.
/Skills/...
